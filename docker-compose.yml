# Interview Coach - Docker Compose Configuration
# PostgreSQL 17 + pgvector extension
# Single data backbone for all persistent storage

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: interview-coach-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interview_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview_coach_dev}
      POSTGRES_DB: ${POSTGRES_DB:-interview_coach}
      # Performance tuning for development
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./python-core/storage/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interview_coach} -d ${POSTGRES_DB:-interview_coach}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: interview-coach-network
