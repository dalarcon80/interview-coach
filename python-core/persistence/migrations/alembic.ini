[alembic]
# Path to migration scripts, relative to this alembic.ini
script_location = %(here)s

# Template used to generate migration file names; %%(year)d etc are escaped
# in the format string itself (not here).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(rev)s_%%(slug)s

# Truncate generated slugs
truncate_slug_length = 40

# Timezone for migration timestamps
timezone = UTC

# Output encoding
output_encoding = utf-8

# SQLAlchemy URL is resolved in env.py from DATABASE_URL env var.
# Leave blank here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
